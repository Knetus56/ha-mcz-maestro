name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches drift caused by upstream Home Assistant changes even without
    # a new commit here (hassfest rules evolve over time).
    - cron: "0 3 * * *"

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  python-and-json:
    name: Python syntax & JSON validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python files
        run: python -m py_compile custom_components/mcz_maestro/*.py

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("custom_components/mcz_maestro")
          files = sorted(root.rglob("*.json"))
          ok = True
          for path in files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"OK    {path}")
              except Exception as exc:  # noqa: BLE001
                  print(f"FAIL  {path}: {exc}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Check entity translation keys are in sync
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("custom_components/mcz_maestro")
          sys.path.insert(0, str(root))
          import const  # const.py has no homeassistant import, safe to load directly

          expected = const.ENTITY_TRANSLATION_KEYS

          ok = True
          for name in ("strings.json", "translations/en.json", "translations/fr.json"):
              data = json.loads((root / name).read_text(encoding="utf-8"))
              entity = data.get("entity", {})

              extra_domains = set(entity.keys()) - set(expected.keys())
              if extra_domains:
                  ok = False
                  print(f"MISMATCH in {name}: unexpected domain(s) {extra_domains} not in const.ENTITY_TRANSLATION_KEYS")

              for domain, keys in expected.items():
                  json_keys = set(entity.get(domain, {}).keys())
                  py_keys = set(keys)
                  missing = py_keys - json_keys
                  extra = json_keys - py_keys
                  if missing or extra:
                      ok = False
                      print(f"MISMATCH in {name} [{domain}]: missing={missing or 'none'} extra={extra or 'none'}")
                  else:
                      print(f"OK    {name} [{domain}] ({len(json_keys)} keys match const.py)")

          sys.exit(0 if ok else 1)
          PY
